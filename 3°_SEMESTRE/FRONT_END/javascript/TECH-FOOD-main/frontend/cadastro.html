<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />
    <title>TechFood - Cadastro do Prato</title>
</head>
<body>

    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu" aria-label="Abrir menu"
        >&#9776;</label
      >

      <nav id="menu">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <form id="cadastro" enctype="multipart/form-data">
        <label for="nome">Nome do Prato:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="descricao">Descrição: </label>
        <input type="text" id="descricao" name="descricao" required>

        <label for="preco">Preço: </label>
        <input type="number" id="preco" name="preco" required>

        <label for="categoria">Categoria: </label>
        <select name="categoria" id="categoria">
          <option value="">Selecione...</option>
          <option value="sobremesa">Sobremesa</option>
          <option value="pratoPrincipal">Prato Principal</option>
        </select>

        <p>Está disponível para venda imediata?</p>
        <input type="radio" id="sim" name="disponivel" value="true">
        <label for="sim">Sim</label>

        <input type="radio" id="nao" name="disponivel" value="false">
        <label for="nao">Não</label>

        <!-- Campo para upload de imagem -->
        <label for="imagem">Imagem do prato:</label>
        <input type="file" id="imagem" name="imagem" accept="image/*">

        <button type="submit">Cadastrar</button>
      </form>
    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <script src="src/scripts/global.js"></script>
    <script src="src/scripts/api.js"></script>
    <script src="src/scripts/cadastro.js"></script>
</body>
</html>
