<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante do Lu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-secondary">

    <!-- CABEÇALHO  -->
    <header class="bg-danger text-white text-center">
        <h1>Cardápio resturante do Lu</h1>
        <p>De Segunda à Sexta</p>
    </header>

    <main class="bg-light">
        
        <section class="row g-3">
            <!-- CARDS -->
            <article class="card col-12 col-md-6 col-lg-4  bg-white p-4 rounded-3 shadow-sm">
                <h2>Feijoada</h2>
                <h4>R$30,00</h4>
                <p>Feijoada deliciosa perfeita para dias frios.</p>
            </article>

            <article class=" card col-12 col-md-6 col-lg-4 bg-white p-4 rounded-3 shadow-sm">
                <h2>Coxinha</h2>
                <h4>R$2,50</h4>
                <p>Crocante por fora macia por dentro, sabor que ninguém esquece.</p>
            </article>


            <article class="card col-12 col-md-6 col-lg-4 bg-white p-4 rounded-3 shadow-sm">
                <h2>Brigadeiro</h2>
                <h4>R$5,00/un</h4>
                <p>Feito com chocolate 100% cacau, indispensável para a vida fitness</p>
            </article>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
