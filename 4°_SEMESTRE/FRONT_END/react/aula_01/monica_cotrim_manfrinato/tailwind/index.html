<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante do Lu</title>

    <link rel="stylesheet" href="output.css">

</head>
<body class="bg-gray-500">

    <!-- CABEÇALHO  -->
    <header class="bg-red-600 text-white text-center">
        <h1 class="text-center text-2xl font-bold mb-3">Cardápio resturante da Quindim</h1>
        <p class="text-center">De Segunda à Sexta</p>
    </header>

    <main class="bg-gray-200">
        
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 bg-gray-100 p-4 rounded-lg shadow-sm gap-4">
            <!-- CARDS -->
            <article class=" bg-white p-4 rounded-lg shadow-sm">
                <h2>Feijoada</h2>
                <h4>R$30,00</h4>
                <p>Feijoada deliciosa perfeita para dias frios.</p>
            </article>

            <article class=" bg-white p-4 rounded-lg shadow-sm">
                <h2 >Coxinha</h2>
                <h4 >R$2,50</h4>
                <p >Crocante por fora macia por dentro, sabor que ninguém esquece.</p>
            </article>


            <article class=" bg-white p-4 rounded-lg shadow-sm">
                <h2 >Brigadeiro</h2>
                <h4>R$5,00/un</h4>
                <p>Feito com chocolate 100% cacau, indispensável para a vida fitness</p>
            </article>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>


<!-- O QUE MUDOU? O QUE FICOU IGUAL? -->

<!-- O visual mudou bastante porque o Bootstrap tem padrões prontos, enquanto o Tailwind exigiu ajustes manuais. Cores, tamanhos de letra e negritos precisaram ser configurados um por um. A estrutura da tela (fundo, cards e conteúdos) continuou igual.O visual mudou bastante em quase tudo. Isso aconteceu porque o Bootstrap já vem com regras prontas. No Tailwind, nós tivemos que criar tudo do zero. Coisas como cor, tamanho de letra e o negrito precisaram ser ajustadas uma por uma à mão. Mesmo com essa mudança no estilo, a base da tela continuou a mesma. O fundo, os blocos de conteúdo e o layout geral não mudaram de lugar. -->
