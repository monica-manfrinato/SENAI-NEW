<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formativa Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- Nav corrigida com Flexbox e fundo vermelho -->
    <nav class="bg-red-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Sabor & Saber</h1>
            <a href="#" class="hover:underline font-medium">Cardápio</a>
        </div>
    </nav>

    <!-- Main com container e espaçamento entre as seções (space-y-8) -->
    <main class="container mx-auto p-4 md:p-6 space-y-8">
        
        <!-- Cards Grid -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 bg-gray-100 p-6 rounded-xl shadow-inner gap-6">
            
            <!-- Card 1 -->
            <article class="bg-white p-5 rounded-lg shadow-sm flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Feijoada</h2>
                    <h4 class="text-lg font-semibold text-green-600 mb-2">R$ 30,00</h4>
                    <p class="text-gray-600 mb-4">Feijoada deliciosa perfeita para dias frios.</p>
                </div>
                <button class="mt-auto w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    Eu quero!
                </button>
            </article>

            <!-- Card 2 -->
            <article class="bg-white p-5 rounded-lg shadow-sm flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Coxinha</h2>
                    <h4 class="text-lg font-semibold text-green-600 mb-2">R$ 2,50</h4>
                    <p class="text-gray-600 mb-4">Crocante por fora macia por dentro, sabor que ninguém esquece.</p>
                </div>
                <button class="mt-auto w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    Eu quero!
                </button>
            </article>

            <!-- Card 3 -->
            <article class="bg-white p-5 rounded-lg shadow-sm flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Brigadeiro</h2>
                    <h4 class="text-lg font-semibold text-green-600 mb-2">R$ 5,00/un</h4>
                    <p class="text-gray-600 mb-4">Feito com chocolate 100% cacau, indispensável para a vida fitness.</p>
                </div>
                <button class="mt-auto w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    Eu quero!
                </button>
            </article>

        </section>

        <!-- Formulário -->
        <form class="w-full max-w-md mx-auto bg-white border border-gray-200 rounded-xl p-6 shadow-md space-y-4">
            <div>
                <label for="nomeCliente" class="block text-sm font-medium text-gray-700 mb-1">Seu nome</label>
                <input 
                    type="text" 
                    id="nomeCliente" 
                    placeholder="Digite seu nome"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all" 
                    required
                />
            </div>

            <div>
                <label for="selectPrato" class="block text-sm font-medium text-gray-700 mb-1">Prato favorito</label>
                <select 
                    id="selectPrato" 
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all"
                >
                    <option>Feijoada</option>
                    <option>Moqueca</option>
                </select>
            </div>

            <button 
                type="submit" 
                id="btnConfirmar"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-sm transition-colors"
            >
                Confirmar Pedido
            </button>
        </form>    
    </main>

</body>
</html>
