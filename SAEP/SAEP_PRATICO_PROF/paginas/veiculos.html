<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina - Veículos</title>
</head>
<body>
    <h1>Veículos</h1>
    <p><a href="/principal">Voltar</a></p>

    <table border="1">
    <tr>
        <th>Placa</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Ano</th>
        <th>Cliente</th>
        <th></th>

    </tr>
    {{#veiculos}}
    <tr>
        <td>{{placa}}</td>
        <td>{{marca}}</td>
        <td>{{modelo}}</td>
        <td>{{ano}}</td>
        <td>{{cliente_id}}</td>
        <td>
            <a href="/veiculos?editar={{id}}">Editar</a>
            <form method="POST" action="/veiculos/{{id}}">
                <input type="hidden" name="_method" value="DELETE"/>
                <button>Excluir</button>
            </form>
        </td>
    </tr>
    {{/veiculos}}
    </table>

    <h2>{{#editando}}Editar{{/editando}}{{^editando}} Cadastrar {{/editando}} veículo</h2>
    <form method="POST" action="{{acao}}">
        {{#editando}}<input type="hidden" name="_method" value="PUT"/>{{/editando}}
        <select name="cliente_id" required>
            <option value="">Selecione o cliente</option>
            {{#clientes}}
            <option value="{{id}}" {{selecionado}}>{{nome}}</option>
            {{/clientes}}
        </select>
        <input type="text" name="placa" placeholder="Placa" value="{{form.placa}}" required>
        <input type="text" name="marca" placeholder="Marca" value="{{form.marca}}">
        <input type="text" name="modelo" placeholder="Modelo" value="{{form.modelo}}">
        <input type="number" name="ano" placeholder="Ano" value="{{form.ano}}">
        <button>{{#editando}}Salvar{{/editando}}{{^editando}} Cadastrar {{/editando}} veiculo</button>
    </form>
    <p>{{erro}}</p>
</body>
</html>
